<!doctype html>

<body>
  <a class="skip" href="#q" data-i18n="request_title">Что хотите</a>

  <!-- the city: full-screen map with glass controls -->

  <div class="map-chip glass" id="map-chip" aria-live="polite"></div>
  <div class="map-note glass" id="map-note" role="status" hidden></div>
  <div class="ctl ctl-top glass" role="group">
    <button type="button" id="btn-theme"></button>
    <button type="button" id="btn-locate-top" class="phone-only on"></button>
  </div>
  <div class="ctl ctl-zoom glass desk-only" role="group">
    <button type="button" id="btn-zin"></button>
    <button type="button" id="btn-zout"></button>
  </div>
  <div class="ctl ctl-loc glass desk-only"><button type="button" id="btn-locate-desk" class="on"></button></div>
  <div class="attrib" id="attrib" data-i18n-attr="aria-label:map_attrib_label" aria-label="Атрибуция карты">

  <!-- phone: a sheet with detents; desktop: a floating panel on the left -->
  <aside class="sheet" id="sheet" aria-label="Seruen">
    <button type="button" class="grab" id="grab" data-i18n-attr="aria-label:grab_label" aria-label="Изменить высоту панели"><i></i></button>
    <div class="sheet-head">
      <div class="brandbar">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#19AA1E"/><path d="M9 23.5c0-3.2 2.6-4.5 7-4.5s7-1.4 7-4.5-2.6-4.5-7-4.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="9" cy="23.5" r="2.4" fill="#fff"/><circle cx="16" cy="10" r="3.2" fill="#FFB919"/></svg>
        <div><b>seruen</b><span data-i18n="tagline">ИИ-помощник для прогулок по Астане</span></div>
      </div>
      <form id="req-form" class="searchrow" role="search" novalidate>
        <label class="search">
          <span data-icon="search"></span>
          <span class="sr-only" data-i18n="request_title">Что хотите</span>
          <input id="q" type="search" enterkeyhint="go" maxlength="400" autocomplete="off">
          <button type="button" class="clear" id="q-clear" data-i18n-attr="aria-label:close_btn" hidden><span data-icon="xfill"></span></button>
        </label>
        <button type="button" class="circle" id="btn-settings" data-i18n-attr="aria-label:settings;title:settings"><span data-icon="gear"></span></button>
      </form>
      <div class="where" id="where-line"></div>
    </div>

    <div class="sheet-body" id="sheet-body">
      <div class="banner" id="mock-banner" hidden>
        <span data-icon="info"></span>
        <p><span data-i18n="mock_banner"></span> <span id="mock-lang" data-i18n="mock_lang"></span></p>
      </div>

      <div class="form-msg" id="origin-msg" role="status"></div>

      <!-- the request -->
      <div class="view" id="view-form">
        <section class="sec" id="origin-sec" hidden>
          <div class="sec-h"><h3 data-i18n="origin_title">Откуда идём</h3></div>
          <div class="list tiles">
            <button type="button" class="row" id="btn-locate"><span class="tile" style="background:var(--blue)"><span data-icon="loc"></span></span><span class="t"><span data-i18n="my_location"></span><span class="s" data-i18n="my_location_sub"></span></span><span class="chev" data-icon="chevR"></span></button>
            <button type="button" class="row" id="btn-mappick"><span class="tile" style="background:var(--tint)"><span data-icon="map"></span></span><span class="t"><span data-i18n="pick_on_map"></span><span class="s" data-i18n="pick_on_map_sub"></span></span><span class="chev" data-icon="chevR"></span></button>
            <button type="button" class="row" id="btn-find"><span class="tile" style="background:var(--red)"><span data-icon="pinf"></span></span><span class="t"><span data-i18n="find_place"></span><span class="s" data-i18n="find_place_sub"></span></span><span class="chev" data-icon="chevR"></span></button>
          </div>
        </section>
        <section class="sec">
          <div class="sec-h"><h3 data-i18n="quick_title">Быстрый выбор</h3></div>
          <div class="quick" id="quick"></div>
        </section>

        <section class="sec">
          <div class="sec-h"><h3 data-i18n="params_title">Параметры</h3></div>
          <div class="list tiles">
            <div class="row stack">
              <span class="t" id="time-label" data-i18n="time_title">Сколько есть времени</span>
              <div class="seg" role="group" aria-labelledby="time-label" id="time-seg"></div>
            </div>
            <div class="row"><span class="tile" style="background:var(--orange)"><span data-icon="child"></span></span><span class="t" id="kids-label" data-i18n="chip_kids">С ребёнком</span><button type="button" class="sw" role="switch" id="sw-kids" aria-checked="false" aria-labelledby="kids-label"></button></div>
            <div class="row"><span class="tile" style="background:var(--teal)"><span data-icon="wheelchair"></span></span><span class="t" id="wheel-label" data-i18n="chip_wheelchair">Коляска</span><button type="button" class="sw" role="switch" id="sw-wheel" aria-checked="false" aria-labelledby="wheel-label"></button></div>
            <div class="row stack">
              <span class="t" id="group-label" data-i18n="group_label">Сколько человек</span>
              <div class="seg" role="group" aria-labelledby="group-label" id="group-seg"></div>
            </div>
          </div>
          <p class="sec-f" data-i18n="time_hint"></p>
        </section>

        <section class="sec">
          <div class="sec-h"><h3 data-i18n="interests_title">Интересы</h3></div>
          <div class="caps" id="interest-caps"></div>
        </section>

        <div class="form-msg" id="form-msg" role="alert"></div>
        <button type="button" class="btn prom block" id="btn-go">
          <svg class="ic spinner" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <span id="btn-go-text" data-i18n="submit">Подобрать</span>
        </button>
        <p class="note lockline"><span data-icon="lock"></span><span><span data-i18n="privacy_line"></span><span id="cell-code"></span></span></p>
      </div>

      <!-- the answer -->
      <div class="view" id="view-results" hidden aria-labelledby="results-title">
        <div class="res-head">
          <div class="ttl"><h1 id="results-title" tabindex="-1"></h1><p class="status" id="status" role="status" aria-live="polite"></p></div>
          <button type="button" class="btn tinted sm" id="btn-edit"><span data-icon="sliders"></span><span data-i18n="edit_request">Изменить запрос</span></button>
        </div>
        <div id="error"></div>
        <div id="ctx"></div>
        <div id="constraints"></div>
        <div id="route"></div>
        <div id="cards"></div>
        <div id="trace"></div>
        <div id="done"></div>
      </div>

      <footer class="foot"><p class="note" data-i18n="credits"></p></footer>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>
  <aside class="panel2" id="panel2" role="dialog" aria-labelledby="p2-title" hidden></aside>
</body>
</html>
