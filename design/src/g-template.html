<!doctype html>
<!--
  Seruen · макет G «2GIS × iOS» — цвета 2GIS, системные компоненты в духе Apple Human Interface Guidelines.
  Карта на весь экран; телефон — системная шторка снизу (три положения), сайт — плавающая панель слева, как у 2GIS,
  карточка места и «Как я выбирал» открываются второй колонкой.
  Состояния (хэш), тёмная тема — суффикс -dark (например #main-dark):
    #start #from #main #detail #jury #settings #loading #error #empty #flight
  Положение шторки на телефоне: ?detent=small|medium|large (по умолчанию — своё у каждого экрана).
  Данные — настоящие ответы системы 20.10.2026 (design/src/f-data.json), вставлены ниже как DATA.
-->
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seruen — прогулка по Астане</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* ---------- tokens: 2GIS brand colours on top of the iOS system palette */
:root {
  --brand: #19AA1E;          /* 2GIS logo green */
  --tint: #19AA1E;           /* icons, toggles, pins */
  --tint-fill: #128A1A;      /* filled buttons: white text passes 4.5:1 */
  --tint-text: #11841A;      /* green text on white */
  --tint-soft: rgba(25,170,30,.12);
  --yellow: #FFB919;         /* 2GIS yellow: stars, taxi */
  --blue: #0073FA;           /* 2GIS blue: you-are-here, route */
  --orange: #FF9500; --red: #FF3B30; --indigo: #5856D6; --purple: #AF52DE; --teal: #30B0C7; --brown: #A2845E; --gray: #8E8E93;
  --map-bg: #F6F2DE;
  --sheet: #F2F2F7;          /* grouped background */
  --cell: #FFFFFF;
  --label: #1F1F1F; --label-2: rgba(60,60,67,.62); --label-3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.16);
  --fill: rgba(120,120,128,.2); --fill-2: rgba(118,118,128,.12);
  --seg-on: #FFFFFF;
  --glass: rgba(255,255,255,.72); --glass-line: rgba(255,255,255,.85); --glass-shadow: 0 8px 28px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.08);
  --panel-shadow: 0 12px 40px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.08);
  --scrim: rgba(0,0,0,.22);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-cell: 16px;
  /* iOS text styles (phone) */
  --t-large: 700 34px/41px var(--font); --t-1: 700 28px/34px var(--font); --t-2: 700 22px/28px var(--font); --t-3: 600 20px/25px var(--font);
  --t-head: 600 17px/22px var(--font); --t-body: 400 17px/22px var(--font); --t-callout: 400 16px/21px var(--font);
  --t-sub: 400 15px/20px var(--font); --t-foot: 400 13px/18px var(--font); --t-cap: 400 12px/16px var(--font);
  --pad: 16px;
}
:root[data-theme="dark"] {
  --tint: #2DBE33; --tint-fill: #1E9E25; --tint-text: #3CCB43; --tint-soft: rgba(45,190,51,.18);
  --yellow: #FFC233; --blue: #3D8BFF; --orange: #FF9F0A; --red: #FF453A; --indigo: #5E5CE6; --purple: #BF5AF2; --teal: #40C8E0; --brown: #AC8E68; --gray: #8E8E93;
  --map-bg: #1B1F24;
  --sheet: #1C1C1E; --cell: #2C2C2E;
  --label: #F5F5F5; --label-2: rgba(235,235,245,.62); --label-3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.55);
  --fill: rgba(120,120,128,.36); --fill-2: rgba(118,118,128,.24);
  --seg-on: #636366;
  --glass: rgba(36,36,40,.66); --glass-line: rgba(255,255,255,.12); --glass-shadow: 0 8px 28px rgba(0,0,0,.45);
  --panel-shadow: 0 12px 40px rgba(0,0,0,.55);
  --scrim: rgba(0,0,0,.5);
}
@media (min-width: 1000px) {   /* desktop panels use the macOS-sized scale */
  :root {
    --t-large: 700 28px/34px var(--font); --t-1: 700 24px/30px var(--font); --t-2: 700 19px/24px var(--font); --t-3: 600 17px/22px var(--font);
    --t-head: 600 15px/20px var(--font); --t-body: 400 15px/20px var(--font); --t-callout: 400 14px/19px var(--font);
    --t-sub: 400 13px/18px var(--font); --t-foot: 400 12px/16px var(--font); --t-cap: 400 11px/14px var(--font);
    --r-cell: 14px; --pad: 14px;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--map-bg); color: var(--label); font: var(--t-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--tint) 55%, transparent); outline-offset: 2px; border-radius: 10px; }
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.ic.f { fill: currentColor; stroke: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- map */
#map { position: fixed; inset: 0; background: var(--map-bg); }
.maplibregl-ctrl-attrib { display: none; }
.attrib { position: fixed; right: 10px; bottom: 8px; z-index: 3; font: var(--t-cap); color: var(--label-2); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 2px 8px; border-radius: 999px; transition: bottom .35s cubic-bezier(.3,.8,.3,1); }

/* glass controls over the map (Liquid Glass) */
.glass { background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); border: .5px solid var(--glass-line); box-shadow: var(--glass-shadow); }
.ctl { position: fixed; z-index: 3; display: grid; border-radius: 999px; overflow: hidden; }
.ctl button { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--label); font-size: 18px; }
.ctl button + button { border-top: .5px solid var(--sep); }
.ctl button.on { color: var(--blue); }
.ctl-top { top: 16px; right: 16px; }
.ctl-zoom { right: 16px; bottom: 96px; }
.ctl-loc { right: 16px; bottom: 40px; }
.privacy { position: fixed; z-index: 3; top: 16px; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; font: 500 13px/1 var(--font); color: var(--label); }
.privacy .ic { color: var(--tint); }
.privacy b { font-weight: 700; }

/* pins */
.pin-main { width: 36px; height: 46px; cursor: pointer; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
.pin-alt { width: 30px; height: 30px; border-radius: 50%; background: var(--cell); border: 2.5px solid var(--tint); color: var(--tint-text); display: grid; place-items: center; font: 700 14px/1 var(--font); box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: pointer; }
.pin-label { position: absolute; white-space: nowrap; font: 600 12px/1 var(--font); color: var(--label); background: var(--cell); padding: 5px 8px; border-radius: 999px; box-shadow: 0 1px 5px rgba(0,0,0,.18); pointer-events: none; }
.pin-wrap.main .pin-label { left: 40px; top: 6px; }
.pin-wrap.alt .pin-label { left: 34px; top: 4px; }
.me { width: 20px; height: 20px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 0 0 7px color-mix(in srgb, var(--blue) 22%, transparent), 0 2px 5px rgba(0,0,0,.3); }

/* ---------- the sheet (phone) / the floating panel (desktop) */
.sheet, .panel2 { position: fixed; z-index: 5; background: var(--sheet); display: flex; flex-direction: column; }
.sheet-head { flex: none; padding: 0 var(--pad) 10px; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px var(--pad) 28px; display: grid; gap: 22px; align-content: start; grid-auto-rows: max-content; }
.grab { display: none; }

@media (max-width: 999.98px) {
  .sheet { left: 0; right: 0; bottom: 0; height: var(--sheet-h, 52vh); border-radius: 28px 28px 0 0; box-shadow: 0 -6px 30px rgba(0,0,0,.14); transition: height .4s cubic-bezier(.3,.8,.3,1); padding-bottom: env(safe-area-inset-bottom); }
  .sheet.dragging { transition: none; }
  .grab { display: grid; place-items: center; height: 22px; cursor: grab; touch-action: none; border: 0; background: none; width: 100%; padding: 0; }
  .grab i { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); }
  .panel2 { left: 0; right: 0; bottom: 0; top: 44px; border-radius: 28px 28px 0 0; transform: translateY(105%); transition: transform .42s cubic-bezier(.3,.8,.3,1); box-shadow: 0 -6px 30px rgba(0,0,0,.2); z-index: 7; }
  .panel2.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 6; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .ctl-zoom { display: none; }
  .ctl-loc { display: none; }
  .privacy { left: 16px; }
  .brandbar { display: none !important; }
  body.det-large .attrib, body.det-large .ctl-top { opacity: 0; pointer-events: none; }
  .attrib, .ctl-top { transition: opacity .25s, bottom .35s cubic-bezier(.3,.8,.3,1); }
}
@media (min-width: 1000px) {
  .sheet { left: 16px; top: 16px; bottom: 16px; width: 400px; border-radius: 22px; box-shadow: var(--panel-shadow); overflow: hidden; }
  .sheet-head { padding-top: 14px; }
  .panel2 { left: 428px; top: 16px; bottom: 16px; width: 380px; border-radius: 22px; box-shadow: var(--panel-shadow); overflow: hidden; display: none; }
  .panel2.open { display: flex; animation: slidein .32s cubic-bezier(.3,.8,.3,1); }
  @keyframes slidein { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  .scrim { display: none; }
  .ctl-top .loc-phone { display: none; }
  .privacy { left: 432px; transition: left .3s; }
  body.p2 .privacy { left: 824px; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .panel2, .attrib { transition: none !important; animation: none !important; } }

/* brand bar (desktop) */
.brandbar { display: flex; align-items: center; gap: 10px; padding: 0 2px 12px; }
.brandbar svg { width: 30px; height: 30px; flex: none; }
.brandbar b { font: 700 18px/1 var(--font); letter-spacing: -.01em; }
.brandbar span { font: var(--t-foot); color: var(--label-2); }

/* search field (capsule, iOS 26) + circular toolbar button */
.searchrow { display: flex; align-items: center; gap: 10px; }
.search { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; border-radius: 999px; background: var(--cell); color: var(--label-2); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
:root[data-theme="dark"] .search { background: var(--fill-2); box-shadow: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: var(--t-body); color: var(--label); }
.search input::placeholder { color: var(--label-2); }
.search .clear { border: 0; background: none; padding: 0; color: var(--label-3); cursor: pointer; display: grid; }
.search .clear .ic { width: 20px; height: 20px; }
.circle { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--cell); color: var(--label); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
:root[data-theme="dark"] .circle { background: var(--fill-2); box-shadow: none; }
.circle.sm { width: 32px; height: 32px; background: var(--fill-2); box-shadow: none; color: var(--label-2); }
.textbtn { border: 0; background: none; padding: 0 2px; color: var(--tint-text); font: var(--t-body); cursor: pointer; white-space: nowrap; }
.where { display: flex; align-items: center; gap: 6px; margin-top: 10px; font: var(--t-sub); color: var(--label-2); min-width: 0; }
.where .ic { color: var(--blue); }
.where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.where b { color: var(--label); font-weight: 500; }
.where a { margin-left: auto; color: var(--tint-text); font-weight: 500; white-space: nowrap; padding-left: 8px; }

/* nav bar inside the second panel */
.nav { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px var(--pad) 8px; }
.nav .l { justify-self: start; display: flex; align-items: center; gap: 2px; color: var(--tint-text); font: var(--t-body); cursor: pointer; }
.nav .l .ic { width: 22px; height: 22px; stroke-width: 2.4; }
.nav h2 { margin: 0; font: var(--t-head); text-align: center; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .r { justify-self: end; display: flex; gap: 8px; }
.nav .done { font-weight: 600; }

/* ---------- typography blocks */
.ttl { display: grid; gap: 3px; }
.ttl h1 { margin: 0; font: var(--t-2); letter-spacing: -.01em; }
.ttl h1.big { font: var(--t-1); }
.ttl p { margin: 0; font: var(--t-sub); color: var(--label-2); }
.sec { display: grid; gap: 8px; }
.sec-h { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; }
.sec-h h3 { margin: 0; font: var(--t-3); letter-spacing: -.01em; }
.sec-h span { margin-left: auto; font: var(--t-foot); color: var(--label-2); }
.sec-f { margin: 0; padding: 0 16px; font: var(--t-foot); color: var(--label-2); }
.note { margin: 0; font: var(--t-foot); color: var(--label-2); padding: 0 4px; }

/* ---------- inset grouped list */
.list { background: var(--cell); border-radius: var(--r-cell); overflow: hidden; }
.row { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; cursor: default; }
a.row, button.row { cursor: pointer; width: 100%; border: 0; background: none; text-align: left; }
a.row:active, button.row:active { background: var(--fill-2); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
.list.tiles .row { --inset: 58px; }
.row .t { font: var(--t-body); min-width: 0; }
.row .t b { font-weight: 600; }
.row .s { display: block; font: var(--t-sub); color: var(--label-2); margin-top: 1px; }
.row .x { font: var(--t-cap); color: var(--label-3); margin-top: 3px; display: block; }
.row .tr { color: var(--label-2); font: var(--t-sub); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.row .chev { width: 15px; height: 15px; color: var(--label-3); stroke-width: 2.4; }
.row.noicon { grid-template-columns: 1fr auto; }
.row.top { align-items: start; }
.tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.tile .ic { width: 18px; height: 18px; stroke-width: 2.1; }
.tile.lg { width: 36px; height: 36px; border-radius: 10px; }
.icn { width: 30px; display: grid; place-items: center; color: var(--tint); }
.icn .ic { width: 22px; height: 22px; }
.para { padding: 14px 16px; font: var(--t-body); }
.para p { margin: 0; }
.para p + p { margin-top: 8px; }

/* number badges */
.badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: #fff; font: 700 14px/1 var(--font); flex: none; }
.badge.o { background: transparent; color: var(--tint-text); box-shadow: inset 0 0 0 2px var(--tint); }

/* capsules (tags) */
.caps { display: flex; flex-wrap: wrap; gap: 6px; }
.cap { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--fill-2); color: var(--label-2); font: 500 13px/1 var(--font); white-space: nowrap; }
.cap .ic { width: 14px; height: 14px; }
.cap.g { background: var(--tint-soft); color: var(--tint-text); }
.cap.o { background: color-mix(in srgb, var(--orange) 16%, transparent); color: color-mix(in srgb, var(--orange) 70%, var(--label)); }
.cap.p { background: color-mix(in srgb, var(--purple) 16%, transparent); color: color-mix(in srgb, var(--purple) 75%, var(--label)); }

/* buttons (iOS 26 capsules) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer; font: 600 17px/1 var(--font); white-space: nowrap; transition: transform .15s, opacity .15s; }
@media (min-width: 1000px) { .btn { height: 38px; font-size: 15px; padding: 0 16px; } }
.btn:active { transform: scale(.97); opacity: .85; }
.btn.prom { background: var(--tint-fill); color: #fff; }
.btn.tinted { background: var(--tint-soft); color: var(--tint-text); }
.btn.gray { background: var(--fill-2); color: var(--label); }
.btn.block { width: 100%; height: 52px; font-size: 17px; }
@media (min-width: 1000px) { .btn.block { height: 44px; font-size: 15px; } }
.btn.icon { width: 44px; padding: 0; }
@media (min-width: 1000px) { .btn.icon { width: 38px; } }
.btn.sm { height: 32px; font-size: 15px; padding: 0 14px; }
.btnrow { display: flex; gap: 8px; }
.btnrow .grow { flex: 1; }

/* segmented control */
.seg { display: flex; padding: 2px; border-radius: 999px; background: var(--fill-2); }
.seg button { flex: 1; height: 30px; border: 0; border-radius: 999px; background: none; cursor: pointer; font: 500 14px/1 var(--font); color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.05); }

/* switch */
.sw { width: 51px; height: 31px; border-radius: 999px; border: 0; padding: 0; background: var(--fill); position: relative; cursor: pointer; transition: background .25s; flex: none; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .28s cubic-bezier(.3,.8,.3,1.2); }
.sw[aria-checked="true"] { background: var(--tint); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }

/* hero card */
.hero { display: grid; gap: 12px; padding: 16px; }
.hero-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
.hero-top h2 { margin: 0; font: var(--t-3); letter-spacing: -.01em; }
.hero-top .c { font: var(--t-sub); color: var(--label-2); }
.rate { text-align: right; }
.rate b { font: 600 17px/1 var(--font); display: inline-flex; align-items: center; gap: 3px; }
.rate b .ic { color: var(--yellow); width: 15px; height: 15px; }
.rate span { display: block; font: var(--t-cap); color: var(--label-2); margin-top: 3px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font: var(--t-sub); color: var(--label-2); }
.status .ok { color: var(--tint-text); font-weight: 600; }
.status .mid { color: color-mix(in srgb, var(--orange) 80%, var(--label)); font-weight: 600; }
.status .ic { width: 15px; height: 15px; }
.kick { display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: start; font: var(--t-sub); color: var(--label-2); }
.kick .ic { margin-top: 2px; color: var(--blue); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: var(--t-sub); color: var(--label-2); }
.meta b { color: var(--label); font-weight: 600; }
.hr { border-top: .5px solid var(--sep); margin: 0 -16px; }
.why p { margin: 0 0 10px; font: var(--t-body); }
.todo { display: grid; grid-template-columns: auto 1fr; gap: 8px; font: var(--t-callout); color: var(--label-2); }
.todo .ic { color: var(--yellow); margin-top: 1px; }
.prov { display: flex; align-items: center; gap: 6px; font: var(--t-foot); color: var(--label-2); padding: 0 4px; }
.prov .ic { color: var(--pc, var(--purple)); }

/* detail header + Apple-Maps-style action buttons */
.place-h { display: grid; gap: 4px; padding: 0 4px; }
.place-h h1 { margin: 0; font: var(--t-1); letter-spacing: -.015em; }
.place-h .c { font: var(--t-sub); color: var(--label-2); }
.stars { display: flex; align-items: center; gap: 6px; font: var(--t-sub); color: var(--label-2); }
.stars i { display: inline-flex; gap: 1px; color: var(--yellow); }
.stars i .ic { width: 15px; height: 15px; }
.stars i .ic.dim { color: var(--fill); }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act { display: grid; justify-items: center; gap: 5px; padding: 10px 6px 9px; border-radius: 14px; background: var(--cell); color: var(--tint-text); font: 600 13px/1.1 var(--font); border: 0; cursor: pointer; }
.act .ic { width: 22px; height: 22px; }
.act.prom { background: var(--tint-fill); color: #fff; }

/* gauges (ProgressView) */
.gauge { display: grid; grid-template-columns: 1fr 96px 34px; gap: 10px; align-items: center; }
.gauge .bar { height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.gauge .bar i { display: block; height: 100%; border-radius: 3px; background: var(--tint); }
.gauge b { font: 600 15px/1 var(--font); text-align: right; font-variant-numeric: tabular-nums; }
@media (min-width: 1000px) { .gauge b { font-size: 13px; } }

/* quick picks (round buttons) */
.quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
@media (max-width: 999.98px) { .quick { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 76px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); scroll-padding: var(--pad); } .quick::-webkit-scrollbar { display: none; } .qb { white-space: nowrap; } }
.qb { display: grid; justify-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 4px 0; font: 500 12px/1.15 var(--font); color: var(--label); text-align: center; }
.qb i { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.qb i .ic { width: 24px; height: 24px; stroke-width: 2; }
@media (min-width: 1000px) { .qb i { width: 44px; height: 44px; } .qb i .ic { width: 20px; height: 20px; } .qb { font-size: 11px; } }

/* itinerary (Maps directions list) */
.itin .row { grid-template-columns: 52px 22px 1fr; gap: 8px; min-height: 52px; }
.itin .row::before { left: 82px !important; }
.itin .tm { font: 600 17px/1 var(--font); font-variant-numeric: tabular-nums; }
@media (min-width: 1000px) { .itin .tm { font-size: 15px; } }
.itin .dot { position: relative; width: 22px; align-self: stretch; display: grid; place-items: center; }
.itin .dot::before { content: ""; position: absolute; left: 10px; top: -12px; bottom: -12px; width: 2px; background: var(--fill); }
.itin .row:first-child .dot::before { top: 50%; }
.itin .row:last-child .dot::before { bottom: 50%; }
.itin .dot i { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--cell); box-shadow: inset 0 0 0 3px var(--c, var(--gray)); }
.itin .ride .dot::before { background: var(--yellow); }

/* transport options */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode { background: var(--fill-2); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
.mode .h { display: flex; align-items: center; gap: 6px; font: 600 14px/1 var(--font); color: var(--label-2); }
.mode .h .ic { color: var(--c); }
.mode .v { font: 700 24px/1.1 var(--font); font-variant-numeric: tabular-nums; }
.mode .d { font: var(--t-foot); color: var(--label-2); }

/* activity indicator + redacted placeholders */
.spinner { width: 20px; height: 20px; animation: spin 1s steps(8) infinite; color: var(--label-2); }
@keyframes spin { to { transform: rotate(360deg); } }
.ph { display: block; height: 14px; border-radius: 7px; background: var(--fill-2); }
.ph.t { height: 20px; }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

/* ContentUnavailableView */
.cuv { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 28px 12px 8px; }
.cuv .ic.big { width: 54px; height: 54px; color: var(--label-3); stroke-width: 1.6; }
.cuv h2 { margin: 6px 0 0; font: var(--t-2); }
.cuv p { margin: 0; font: var(--t-body); color: var(--label-2); max-width: 330px; }
.cuv .btns { display: grid; gap: 8px; margin-top: 10px; width: 100%; max-width: 300px; }

.hide { display: none !important; }
</style>

    return '<div class="sec"><div class="sec-h"><h3>Язык</h3></div><div class="list">' +

      '<div class="sec"><div class="sec-h"><h3>Оформление</h3></div><div class="seg" role="group" aria-label="Тема"><button aria-pressed="false">Авто</button><button aria-pressed="' + !dark + '">Светлая</button><button aria-pressed="' + dark + '">Тёмная</button></div></div>' +
      '<div class="sec"><div class="list tiles"><div class="row">' + tile('doc', 'var(--gray)') + '<span class="t">Режим без ИИ</span><button class="sw" role="switch" aria-checked="false" aria-label="Режим без ИИ"></button></div></div>' +
      '<p class="sec-f">Тексты «почему» соберёт код из фактов. Подбор мест и маршрут не изменятся.</p></div>' +
      '<div class="sec"><div class="sec-h"><h3>Приватность</h3></div><div class="list tiles">' +
      '<div class="row">' + tile('lock', 'var(--blue)') + '<span class="t">Что видит сервер</span><span class="tr">клетка ~150 м</span></div>' +
      '<div class="row">' + tile('clock', 'var(--indigo)') + '<span class="t">Сессия</span><span class="tr">30 мин</span></div>' +
      '<button class="row">' + tile('trash', 'var(--red)') + '<span class="t" style="color:var(--red)">Удалить мои данные</span><span></span></button></div>' +
      '<p class="sec-f">Точку на карте телефон превращает в клетку ~150 м сам — точные координаты никуда не уходят.</p></div>' +
      '<div class="sec"><div class="sec-h"><h3>О данных</h3></div><div class="list tiles">' +
      '<a class="row" href="#settings">' + tile('globe', 'var(--teal)') + '<span class="t">Источники и лицензии</span>' + ic('chev', 'chev') + '</a>' +
      '<a class="row" href="#settings">' + tile('map', 'var(--tint)') + '<span class="t">Работает на API 2ГИС</span>' + ic('chev', 'chev') + '</a></div>' +
      '<p class="sec-f">© OpenStreetMap, Overture Maps, Wikidata, Wikivoyage, visitastana.kz. Seruen 0.9 · хакатон GDG Astana 2026.</p></div>';
  }

  /* ------------------------------------------------------------ map */
  let map = null, markers = [], mapStyle = null;
  function geohashBox(gh) {
    const B = '0123456789bcdefghjkmnpqrstuvwxyz'; let lat = [-90, 90], lon = [-180, 180], even = true;
    for (const c of gh) { const cd = B.indexOf(c); for (const mask of [16, 8, 4, 2, 1]) { const r = even ? lon : lat; const mid = (r[0] + r[1]) / 2; if (cd & mask) r[0] = mid; else r[1] = mid; even = !even; } }
    return [[lon[0], lat[0]], [lon[1], lat[0]], [lon[1], lat[1]], [lon[0], lat[1]], [lon[0], lat[0]]];
  }
  function paint2gis(dark) {   // recolour OpenFreeMap towards the 2GIS map palette
    const set = (id, prop, v) => { try { if (map.getLayer(id)) map.setPaintProperty(id, prop, v); } catch (e) {} };
    const hide = (id) => { try { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none'); } catch (e) {} };
    if (!dark) {
      set('background', 'background-color', '#F6F2DE');
      ['park', 'landcover_grass'].forEach((id) => set(id, 'fill-color', '#D3E8B7'));
      set('landcover_wood', 'fill-color', '#C6E1A6'); set('park_outline', 'line-color', '#C3DCA2');
      set('landuse_residential', 'fill-color', '#F2EDD8');
      set('water', 'fill-color', '#A9D3F5'); ['waterway_river', 'waterway_other', 'waterway_tunnel'].forEach((id) => set(id, 'line-color', '#A9D3F5'));
      set('building', 'fill-color', '#E7E1CE'); set('building', 'fill-outline-color', '#D8D0B8');
      ['road_minor', 'road_service_track', 'bridge_street', 'road_path_pedestrian'].forEach((id) => set(id, 'line-color', '#FFFFFF'));
      ['road_secondary_tertiary', 'road_link', 'bridge_secondary_tertiary', 'bridge_link'].forEach((id) => set(id, 'line-color', '#FFFFFF'));
      ['road_trunk_primary', 'bridge_trunk_primary'].forEach((id) => set(id, 'line-color', '#FFE9A6'));
      ['road_motorway', 'bridge_motorway', 'road_motorway_link'].forEach((id) => set(id, 'line-color', '#FFD27A'));
      ['road_minor_casing', 'road_service_track_casing', 'road_secondary_tertiary_casing', 'road_link_casing', 'road_trunk_primary_casing', 'road_motorway_casing'].forEach((id) => set(id, 'line-color', '#E2D9BF'));
      ['poi_r1', 'poi_r7', 'poi_r20', 'building-3d'].forEach(hide);
    } else {
      set('background', 'background-color', '#1B1F24');
      set('water', 'fill-color', '#15283B'); set('waterway', 'line-color', '#15283B');
      ['landcover_wood', 'landuse_park'].forEach((id) => set(id, 'fill-color', '#1D2E23'));
      set('landuse_residential', 'fill-color', '#1E2227');
      set('building', 'fill-color', '#292E35');
      ['highway_minor', 'highway_path'].forEach((id) => set(id, 'line-color', '#2C3139'));
      ['highway_major_inner', 'highway_major_subtle'].forEach((id) => set(id, 'line-color', '#3A4049'));
      ['highway_major_casing', 'highway_motorway_casing'].forEach((id) => set(id, 'line-color', '#2C3139'));
      set('highway_motorway_inner', 'line-color', '#4A4434'); set('highway_motorway_subtle', 'line-color', '#3A3A33');
      ['highway_name_other', 'highway_name_motorway'].forEach((id) => { set(id, 'text-color', '#8C949F'); set(id, 'text-halo-color', '#1B1F24'); });
      ['place_other', 'place_suburb', 'place_village', 'place_town', 'place_city', 'place_city_large'].forEach((id) => { set(id, 'text-color', '#A0A8B3'); set(id, 'text-halo-color', '#1B1F24'); });
    }
  }
  function sheetPx() {
    if (!phone()) return 0;
    return $('#sheet').getBoundingClientRect().height;
  }
  function declutter() {   // a pin together with its label is a box; alternatives move up or down until their box is free
    if (!map) return;
    const H = map.getContainer().clientHeight - sheetPx();
    const box = (m, dy) => {
      const p = map.project(m.getLngLat());
      const lab = m.getElement().querySelector('.pin-label');
      const w = lab ? lab.offsetWidth + 6 : 0;
      const cy = (m.__kind === 'main' ? p.y - 27 : p.y) + dy;
      const r = m.__kind === 'me' ? 22 : 17;
      return {x1: p.x - r, x2: p.x + r + w, y1: cy - r, y2: cy + r};
    };
    const hit = (a, b) => a.x1 < b.x2 && b.x1 < a.x2 && a.y1 < b.y2 && b.y1 < a.y2;
    const placed = markers.filter((m) => m.__kind !== 'alt').map((m) => box(m, 0));
    markers.filter((m) => m.__kind === 'alt').forEach((m) => {
      const ok = (dy) => { const b = box(m, dy); return b.y1 > 56 && b.y2 < H - 12 && !placed.some((q) => hit(q, b)); };
      const dy = [0, -36, 36, -72, 72, -108, 108].find(ok) ?? 0;
      m.setOffset([0, dy]);
      placed.push(box(m, dy));
    });
  }
  function fit(s, cards) {
    const cell = geohashBox(s.cell);
    const pts = [[s.origin.lon, s.origin.lat], ...cards.map((c) => [c.lon, c.lat]), ...cell];
    const b = pts.reduce((bb, p) => bb.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
    const open = $('#panel2').classList.contains('open');
    const pad = phone() ? {top: 110, bottom: sheetPx() + 40, left: 40, right: 140} : {top: 90, bottom: 70, left: 16 + 400 + 70 + (open ? 392 : 0), right: 220};
    map.fitBounds(b, {padding: pad, maxZoom: 16.6, duration: 0});
    declutter();
  }
  let lastFit = null;
  function setMap(s, cards, opts = {}) {
    const dark = document.documentElement.dataset.theme === 'dark';
    const style = 'https://tiles.openfreemap.org/styles/' + (dark ? 'dark' : 'liberty');
    $('#privacy').innerHTML = ic('lock') + 'Сервер видит только клетку <b>~150 м</b>';
    const main = cards.find((c) => c.role !== 'alternative');
    const draw = () => {
      paint2gis(dark);
      markers.forEach((m) => m.remove()); markers = [];
      const cell = geohashBox(s.cell);
      const byId = Object.fromEntries((s.cards || []).map((c) => [c.poi_id, c]));
      const route = opts.noRoute ? [] : (s.route && s.route.legs || []).flatMap((l) => {
        const to = byId[l.to_id];
        if (l.meters < 150 && to) return [[s.origin.lon, s.origin.lat], [to.lon, to.lat]];   // same building: 2GIS goes via the entrance, a straight line reads better
        return (l.geometry || []).filter((p, i, a) => !i || p[0] !== a[i - 1][0] || p[1] !== a[i - 1][1]);
      });
      const srcs = {cell: {type: 'Feature', geometry: {type: 'Polygon', coordinates: [cell]}}, route: {type: 'Feature', geometry: {type: 'LineString', coordinates: route.length > 1 ? route : [[s.origin.lon, s.origin.lat], [s.origin.lon, s.origin.lat]]}}};
      for (const [id, data] of Object.entries(srcs)) { if (map.getSource(id)) map.getSource(id).setData(data); else map.addSource(id, {type: 'geojson', data}); }
      const blue = dark ? '#3D8BFF' : '#0073FA';
      if (!map.getLayer('cell-fill')) {
        map.addLayer({id: 'cell-fill', type: 'fill', source: 'cell', paint: {'fill-color': blue, 'fill-opacity': dark ? .14 : .08}});
        map.addLayer({id: 'cell-line', type: 'line', source: 'cell', paint: {'line-color': blue, 'line-width': 1.5, 'line-dasharray': [2, 2]}});
        map.addLayer({id: 'route-casing', type: 'line', source: 'route', paint: {'line-color': dark ? '#0B0D10' : '#FFFFFF', 'line-width': 9}, layout: {'line-cap': 'round', 'line-join': 'round'}});
        map.addLayer({id: 'route', type: 'line', source: 'route', paint: {'line-color': blue, 'line-width': 5}, layout: {'line-cap': 'round', 'line-join': 'round'}});
      }
      const me = document.createElement('div'); me.className = 'me';
      const mm = new maplibregl.Marker({element: me}).setLngLat([s.origin.lon, s.origin.lat]).addTo(map); mm.__kind = 'me'; markers.push(mm);
      cards.forEach((c, i) => {
        const isMain = c === main;
        const wrap = document.createElement('div'); wrap.className = 'pin-wrap ' + (isMain ? 'main' : 'alt');
        if (isMain) wrap.innerHTML = '<svg class="pin-main" viewBox="0 0 36 46" aria-hidden="true"><path d="M18 44.5S3 29.6 3 18.5a15 15 0 0 1 30 0C33 29.6 18 44.5 18 44.5z" fill="' + (dark ? '#2DBE33' : '#19AA1E') + '" stroke="#fff" stroke-width="2.5"/><text x="18" y="23.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700" fill="#fff">' + (i + 1) + '</text></svg>';
        else wrap.innerHTML = '<div class="pin-alt">' + (i + 1) + '</div>';
        const lab = document.createElement('span'); lab.className = 'pin-label'; lab.textContent = c.name.length > 24 ? c.name.slice(0, 23) + '…' : c.name; wrap.appendChild(lab);
        const mk = new maplibregl.Marker({element: wrap, anchor: isMain ? 'bottom' : 'center'}).setLngLat([c.lon, c.lat]).addTo(map);
        mk.__kind = isMain ? 'main' : 'alt'; markers.push(mk);
      });
      lastFit = () => fit(s, cards);
      lastFit();
      map.once('idle', () => { window.__mapIdle = true; });
    };
    if (!map || mapStyle !== style) {
      if (map) map.remove();
      mapStyle = style;
      map = new maplibregl.Map({container: 'map', style, center: [s.origin.lon, s.origin.lat], zoom: 15, attributionControl: false});
      map.on('load', draw);
      map.on('zoomend', declutter);
    } else if (map.isStyleLoaded()) draw(); else map.once('load', draw);
  }

  /* ------------------------------------------------------------ phone sheet: detents + drag */
  const DETENTS = {small: 150, medium: 0.5, large: 0.9};
  const detentPx = (d) => { const v = DETENTS[d]; return v > 1 ? v : Math.round(window.innerHeight * v); };
  function setDetent(d) {
    const sh = $('#sheet');
    sh.dataset.detent = d;
    document.body.classList.toggle('det-large', d === 'large');
    sh.style.setProperty('--sheet-h', detentPx(d) + 'px');
    $('#attrib').style.bottom = phone() ? (detentPx(d) + 8) + 'px' : '';
  }
  (function drag() {
    const sh = $('#sheet'), g = $('#grab');
    let y0 = 0, h0 = 0, on = false;
    g.addEventListener('click', () => { if (on) return; const order = ['small', 'medium', 'large']; setDetent(order[(order.indexOf(sh.dataset.detent) + 1) % 3]); setTimeout(() => lastFit && lastFit(), 420); });
    g.addEventListener('pointerdown', (e) => { y0 = e.clientY; h0 = sh.getBoundingClientRect().height; on = false; g.setPointerCapture(e.pointerId); sh.classList.add('dragging'); });
    g.addEventListener('pointermove', (e) => { if (!g.hasPointerCapture(e.pointerId)) return; const dy = e.clientY - y0; if (Math.abs(dy) > 4) on = true; sh.style.setProperty('--sheet-h', Math.max(120, h0 - dy) + 'px'); });
    g.addEventListener('pointerup', (e) => {
      sh.classList.remove('dragging');
      if (!on) return;
      const h = sh.getBoundingClientRect().height;
      const best = Object.keys(DETENTS).reduce((a, d) => (Math.abs(detentPx(d) - h) < Math.abs(detentPx(a) - h) ? d : a), 'medium');
      setDetent(best); setTimeout(() => { on = false; lastFit && lastFit(); }, 420);
    });
  })();

  /* ------------------------------------------------------------ router */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1) || 'main');
    const dark = /-dark$/.test(h);
    const name = h.replace(/-dark$/, '');
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('#theme').innerHTML = ic(dark ? 'sun' : 'moon');
    $('#theme').onclick = () => { location.hash = name + (dark ? '' : '-dark'); };
    $('.loc-phone').innerHTML = ic('loc'); $('#loc').innerHTML = ic('loc'); $('#zin').innerHTML = ic('plus'); $('#zout').innerHTML = ic('minus');
    $('#zin').onclick = () => map && map.zoomIn(); $('#zout').onclick = () => map && map.zoomOut();
    const p2 = $('#panel2'); p2.classList.remove('open'); p2.innerHTML = ''; $('#scrim').classList.remove('open'); document.body.classList.remove('p2');
    const q = new URLSearchParams(location.search).get('detent');
    const defaultDetent = {start: 'medium', from: 'large', empty: 'medium', flight: 'medium', loading: 'medium'}[name] || 'medium';
    setDetent(q || defaultDetent);
    window.__mapIdle = false;
    const main = mainCard(K);
    if (name === 'detail') openPanel(nav(main.name, backBtn('План'), '<button class="circle sm" aria-label="Поделиться">' + ic('share') + '</button>' + closeBtn), detailHTML(K, main));
    if (name === 'jury') openPanel(nav('', backBtn('План'), closeBtn), juryHTML(K));
    if (name === 'settings') openPanel(nav('Настройки', '<span></span>', '<a class="textbtn done" href="#main">Готово</a>'), settingsHTML());
    if (name === 'start') screenStart();
    else if (name === 'from') screenFrom();
    else if (name === 'empty') screenEmpty();
    else if (name === 'flight') screenFlight();
    else if (name === 'loading') screenMain({loading: true});
    else if (name === 'error') screenMain({error: true, tpl: true});
    else screenMain();
    $('#body').scrollTop = 0;
    document.querySelectorAll('a[href^="#"]').forEach((a) => {
      const base = a.getAttribute('href').slice(1).replace(/-dark$/, '');
      a.setAttribute('href', '#' + base + (dark ? '-dark' : ''));
    });
  }
  $('#scrim').addEventListener('click', () => { location.hash = 'main' + (document.documentElement.dataset.theme === 'dark' ? '-dark' : ''); });
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => { setDetent($('#sheet').dataset.detent || 'medium'); lastFit && lastFit(); });
  route();
})();
</script>
</body>
</html>
