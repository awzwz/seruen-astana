<!doctype html>
<!--
  Seruen · макет F «Небо Астаны» — собственный дизайн.
  Состояния (хэш в адресе), тёмная тема — суффикс -dark (например #main-dark):
    #start    — первый экран: где вы, небо на ближайшие часы, «что хотите», примеры
    #main     — «Мы с ребёнком, у нас час», Хан Шатыр 18:30, −8 °C по ощущениям: план + главное место + запасные
    #flight   — «2 часа до вылета» от KeruenCity: успеть одно место и вовремя выехать (такси / автобус + LRT из 2GIS)
    #detail   — карточка места целиком (Fame City)
    #jury     — «Как Seruen выбирал»: 5 шагов простым языком + цифры для жюри
    #loading  — подбор идёт: факты уже есть, текст ИИ дописывается
    #error    — ИИ не ответил вовремя: тексты по шаблону, факты посчитаны кодом
    #empty    — рядом ничего не подошло
  Данные — настоящие ответы системы 20.10.2026 (design/sample-data-2.json), вставлены ниже как DATA.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seruen — прогулка по Астане</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root {
  /* Палитра «небо Астаны»: холодная бумага, глубокие чернила, бирюза неба и золото солнца — по одному акценту на смысл */
  --paper: #F4F6F5; --surface: #FFFFFF; --surface-2: #EEF2F1; --line: #DEE5E6; --line-2: #C9D3D6;
  --ink: #13202A; --ink-2: #455763; --ink-3: #788992;
  --sky: #1C7EA8; --sky-ink: #136587; --sky-soft: #E2F0F6;
  --sun: #C9870A; --sun-soft: #FBF0D6;
  --ok: #2B7A4B; --ok-soft: #E3F1E8; --mid: #2D6AAA; --mid-soft: #E5EEF8;
  --warn: #A9580F; --warn-soft: #FBEDDD; --bad: #B23A33; --bad-soft: #F8E5E3;
  --cold: #4A7CC6; --cold-soft: #E6EEFA;
  --shadow: 0 1px 2px rgba(19, 32, 42, .06), 0 8px 24px rgba(19, 32, 42, .06);
  --r-xl: 22px; --r-l: 18px; --r-m: 14px; --r-s: 10px;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #09101A; --surface: #0F1926; --surface-2: #152234; --line: #213148; --line-2: #2C3F5A;
  --ink: #E7EEF5; --ink-2: #A8B7C5; --ink-3: #73859A;
  --sky: #5DC0E5; --sky-ink: #86D3F0; --sky-soft: #0F2E3D;
  --sun: #F2B33D; --sun-soft: #33270E;
  --ok: #5BC184; --ok-soft: #10301E; --mid: #7DAEE6; --mid-soft: #12253D;
  --warn: #EFA25A; --warn-soft: #3A250F; --bad: #F07A70; --bad-soft: #3A1714;
  --cold: #84AAEC; --cold-soft: #13233F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--sky-ink); }
.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.s { width: 15px; height: 15px; }
.ic.l { width: 22px; height: 22px; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 8px; }

/* ---------- layout: phone = one column; desktop = story on the left, the city on the right */
.app { min-height: 100%; }
.side { padding: 0 max(16px, env(safe-area-inset-left)) 28px max(16px, env(safe-area-inset-right)); display: grid; gap: 14px; align-content: start; }
.side > * { min-width: 0; }
.where { min-width: 0; }
.mapzone { position: relative; }
#map { position: absolute; inset: 0; }
@media (min-width: 1000px) {
  .app { display: grid; grid-template-columns: 488px 1fr; height: 100vh; }
  .side { height: 100vh; overflow-y: auto; padding: 0 28px 32px; border-right: 1px solid var(--line); background: var(--paper); }
  .mapzone { height: 100vh; }
  .phone-map { display: none !important; }
}
@media (max-width: 999.98px) {
  .mapzone { display: block; position: static; height: 0; }
  .mapzone > #map-home, .mapzone > .mapbadge, .mapzone > .attrib { display: none; }
  .phone-map { position: relative; height: 230px; border-radius: var(--r-l); overflow: hidden; border: 1px solid var(--line); }
  .phone-map #map { position: absolute; inset: 0; }
}

/* ---------- top bar */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; background: var(--paper); }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.brand b { font: 600 19px/1 var(--display); letter-spacing: -.01em; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2); }

/* ---------- where */
.where { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.where .pin { width: 32px; height: 32px; border-radius: 10px; background: var(--sky-soft); color: var(--sky-ink); display: grid; place-items: center; flex: none; }
.where .t { min-width: 0; flex: 1; }
.where .k { font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }
.where .v { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where .v small { font-weight: 400; color: var(--ink-3); }
.where button { border: 0; background: none; color: var(--sky-ink); font-weight: 600; font-size: 13.5px; cursor: pointer; padding: 6px; }
.suggest { margin-top: -6px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.suggest input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; font: inherit; background: none; color: inherit; outline: none; }
.suggest li { list-style: none; padding: 9px 14px; display: grid; }
.suggest li + li { border-top: 1px solid var(--line); }
.suggest li span { font-size: 12.5px; color: var(--ink-3); }
.suggest ul { margin: 0; padding: 0; }
.suggest .src { font-size: 11px; color: var(--ink-3); padding: 7px 14px; background: var(--surface-2); }

/* ---------- the sky strip: time of day, sunset, plan and minutes in the cold */
.sky { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 12px 10px; }
.sky-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
.sky-head .now { font: 600 20px/1 var(--display); letter-spacing: -.01em; margin-right: 4px; font-variant-numeric: tabular-nums; }
.sky-head .w { color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.sky svg.strip { display: block; width: 100%; height: auto; margin-top: 10px; }
.strip .tick { fill: var(--ink-3); font: 500 10px var(--font); font-variant-numeric: tabular-nums; }
.strip .lbl { fill: var(--ink); font: 600 10.5px var(--font); }
.strip .lbl-w { fill: #fff; font: 600 10.5px var(--font); }
.strip .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.mode { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-top: 8px; }
.mode.cold { background: var(--cold-soft); color: var(--cold); }
.mode.walk { background: var(--ok-soft); color: var(--ok); }
.mode-why { font-size: 12.5px; color: var(--ink-3); margin-left: 4px; }

/* ---------- composer */
.composer { display: grid; gap: 10px; }
.ask { position: relative; }
.ask textarea { width: 100%; min-height: 58px; resize: none; border: 1.5px solid var(--line-2); border-radius: var(--r-l); background: var(--surface); padding: 15px 16px; font: 500 16.5px/1.35 var(--font); color: var(--ink); outline: none; }
.ask textarea:focus { border-color: var(--sky); }
.ask textarea::placeholder { color: var(--ink-3); font-weight: 400; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.ghost { border-style: dashed; }
.go { height: 52px; border-radius: 16px; border: 0; background: var(--ink); color: var(--paper); font: 600 16px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.go:hover { filter: brightness(1.12); }

/* ---------- plan header */
.plan-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.plan-h h1 { margin: 0; font: 600 23px/1.15 var(--display); letter-spacing: -.015em; }
.plan-h .when { font: 500 15px var(--font); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.plan-sub { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: -6px; }
.plan-sub span { display: inline-flex; gap: 5px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- hero card */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow); overflow: hidden; }
.hero-in { padding: 16px 16px 14px; display: grid; gap: 12px; }
.hero-top { display: flex; gap: 12px; align-items: flex-start; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 600 14px var(--display); flex: none; }
.num.hollow { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); }
.hero h2 { margin: 0; font: 600 22px/1.15 var(--display); letter-spacing: -.015em; }
.cat { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
.facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.hours { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-m); font-size: 14px; }
.hours.high { background: var(--ok-soft); }
.hours.medium { background: var(--mid-soft); }
.hours.low { background: var(--warn-soft); }
.hours.unknown { background: var(--surface-2); }
.hours.open_area { background: var(--surface-2); }
.hours b { font-weight: 600; }
.hours .src { margin-left: auto; font-size: 12px; color: var(--ink-3); text-align: right; }
.meter { display: inline-grid; grid-auto-flow: column; gap: 2px; }
.meter i { width: 5px; height: 14px; border-radius: 2px; background: var(--line-2); }
.meter.l3 i { background: var(--ok); }
.meter.l2 i:nth-child(-n+2) { background: var(--mid); }
.meter.l1 i:nth-child(1) { background: var(--warn); }
.why { background: var(--sky-soft); border-radius: var(--r-m); padding: 12px 13px; display: grid; gap: 8px; }
.why p { margin: 0; font-size: 15px; line-height: 1.5; }
.k { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--sky-ink); }
.reasons { display: flex; gap: 6px; flex-wrap: wrap; }
.reasons span { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.todo { display: grid; gap: 4px; }
.todo p { margin: 0; font-size: 15px; }
.prov { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.tag.data { background: var(--surface-2); color: var(--ink-2); }
.tag.ai { background: var(--sun-soft); color: var(--sun); }
.tag.tpl { background: var(--surface-2); color: var(--ink-3); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 14px; border-top: 1px solid var(--line); background: var(--surface); }
.btn { height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--sky); border-color: var(--sky); color: #fff; }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); padding: 0 8px; font-weight: 500; }
.fb { margin-left: auto; display: flex; gap: 2px; }
.fb button { border: 0; background: none; padding: 6px 7px; border-radius: 9px; cursor: pointer; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; }
.fb button:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- alternatives */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; }
.sec-h h3 { margin: 0; font: 600 15px var(--display); letter-spacing: -.01em; }
.sec-h span { font-size: 12.5px; color: var(--ink-3); }
.alts { display: grid; gap: 10px; }
.alt { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-l); background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.alt:hover { border-color: var(--line-2); }
.alt h4 { margin: 0; font-size: 15.5px; font-weight: 600; }
.alt .m { font-size: 13px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.alt .m span { display: inline-flex; align-items: center; gap: 4px; }
.alt .go-s { color: var(--ink-3); }

/* ---------- flight: leave in time */
.leave { border-radius: var(--r-xl); background: var(--ink); color: var(--paper); padding: 16px; display: grid; gap: 12px; }
:root[data-theme="dark"] .leave { background: #1A2A44; color: var(--ink); }
.leave .big { font: 600 26px/1.1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.leave .sub { font-size: 13.5px; opacity: .78; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { border-radius: var(--r-m); background: rgba(255,255,255,.08); padding: 10px 12px; display: grid; gap: 3px; }
:root:not([data-theme="dark"]) .move { background: rgba(255,255,255,.1); }
.move .h { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.move .t { font: 600 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.move .d { font-size: 12.5px; opacity: .78; }
.leave a { color: inherit; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; }
.picks { display: grid; gap: 10px; }
.pick { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 13px 14px; display: grid; gap: 8px; cursor: pointer; }
.pick.best { border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-soft); }
.pick .row { display: flex; gap: 10px; align-items: flex-start; }
.pick h4 { margin: 0; font-size: 16px; font-weight: 600; }
.pick p { margin: 0; font-size: 14px; color: var(--ink-2); }

/* ---------- map ui */
.mapbadge { position: absolute; left: 16px; top: 16px; z-index: 2; display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; box-shadow: var(--shadow); color: var(--ink-2); }
.mapbadge b { color: var(--ink); font-weight: 600; }
.attrib { position: absolute; right: 8px; bottom: 6px; z-index: 2; font-size: 10.5px; color: var(--ink-3); background: color-mix(in srgb, var(--surface) 86%, transparent); padding: 2px 7px; border-radius: 6px; }
.attrib a { color: inherit; text-decoration: none; }
.expand { position: absolute; right: 10px; top: 10px; z-index: 2; }
.pin-m { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 600 13px/1 var(--display); border: 2.5px solid var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: pointer; }
.pin-m.pin-alt { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.pin-wrap { width: 30px; height: 30px; }
.pin-label { position: absolute; left: 34px; top: 4px; white-space: nowrap; font: 600 12px var(--font); color: var(--ink); background: var(--surface); padding: 2px 7px; border-radius: 7px; box-shadow: 0 1px 4px rgba(0,0,0,.15); pointer-events: none; }
.me { width: 18px; height: 18px; border-radius: 50%; background: var(--sky); border: 3px solid #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--sky) 25%, transparent); }

/* ---------- side panel (desktop) / sheet (phone): detail and «how I chose» */
.panel { position: absolute; top: 14px; right: 14px; bottom: 14px; width: 440px; z-index: 4; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow); overflow-y: auto; display: none; }
.panel.open { display: block; }
@media (max-width: 999.98px) {
  .panel { position: fixed; inset: 0; width: auto; border-radius: 0; border: 0; z-index: 20; }
  .panel-host { display: contents; }
}
.panel-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font: 600 16px var(--display); flex: 1; }
.panel-body { padding: 16px; display: grid; gap: 16px; }
.dl { display: grid; gap: 10px; }
.dl > div { display: grid; grid-template-columns: 112px 1fr; gap: 10px; font-size: 14px; }
.dl dt { color: var(--ink-3); }
.dl dd { margin: 0; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 150px 1fr 38px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; background: var(--sky); }
.bar b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.step .n { width: 34px; height: 34px; border-radius: 12px; background: var(--sky-soft); color: var(--sky-ink); display: grid; place-items: center; }
.step.done .n { background: var(--ok-soft); color: var(--ok); }
.step.run .n { background: var(--sun-soft); color: var(--sun); }
.step.wait .n { background: var(--surface-2); color: var(--ink-3); }
.step h4 { margin: 6px 0 2px; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.step h4 small { font-weight: 500; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.step p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.step .tech { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.flows { display: grid; gap: 8px; }
.flow { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 12px; border-radius: var(--r-m); background: var(--surface-2); font-size: 13.5px; }
.flow b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 2px; }
.flow.never { background: var(--ok-soft); }
.note { font-size: 12.5px; color: var(--ink-3); }

/* ---------- states */
.plate { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; border-radius: var(--r-m); font-size: 14px; }
.plate.err { background: var(--bad-soft); color: var(--ink); }
.plate.err .ic { color: var(--bad); }
.plate.info { background: var(--sun-soft); }
.plate.info .ic { color: var(--sun); }
.plate b { font-weight: 600; }
.sk { border-radius: 8px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s ease-in-out infinite; height: 12px; }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (m) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
  const num = (x, f = 0) => Number(x).toLocaleString('ru-RU', {minimumFractionDigits: f, maximumFractionDigits: f});
  const $ = (s) => document.querySelector(s);

  const K = DATA.kids_evening_khan_shatyr, F = DATA.flight_keruencity;
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const fmt = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };

  /* ------------------------------------------------------------ the sky strip */
  const SKY = [[-200, '#BCDDEC'], [-110, '#CFE6EF'], [-45, '#F4DBA5'], [-12, '#F1B46A'], [8, '#C9787A'], [30, '#6B5C90'], [65, '#2C3B67'], [120, '#1B2747'], [400, '#18223F']];
  function skyColor(m) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const [a, ca] = SKY[i], [b, cb] = SKY[i + 1];
      if (m <= b) {
        const t = Math.max(0, Math.min(1, (m - a) / (b - a)));
        const pa = ca.match(/\w\w/g).map((x) => parseInt(x, 16)), pb = cb.match(/\w\w/g).map((x) => parseInt(x, 16));
        return '#' + pa.map((v, j) => Math.round(v + (pb[j] - v) * t).toString(16).padStart(2, '0')).join('');
      }
    }
    return SKY[SKY.length - 1][1];
  }
  function skyStrip(s, plan) {
    const now = toMin(s.context.local_time.slice(11, 16));
    const sunset = toMin(s.context.sunset);
    const t0 = now - 30, t1 = now + Math.max(150, (s.constraints.time_budget_min || 60) + 40);
    const W = 420, X0 = 6, X1 = W - 6;
    const x = (t) => X0 + (t - t0) / (t1 - t0) * (X1 - X0);
    let stops = '';
    for (let t = t0; t <= t1; t += 10) stops += '<stop offset="' + ((t - t0) / (t1 - t0) * 100).toFixed(1) + '%" stop-color="' + skyColor(t - sunset) + '"/>';
    let g = '<defs><linearGradient id="skyg" x1="0" x2="1">' + stops + '</linearGradient></defs>';
    g += '<rect x="' + X0 + '" y="4" width="' + (X1 - X0) + '" height="34" rx="10" fill="url(#skyg)"/>';
    // stars after dark
    for (let t = t0; t <= t1; t += 7) if (t - sunset > 50 && (t * 37) % 11 < 3) g += '<circle cx="' + x(t).toFixed(1) + '" cy="' + (10 + (t * 13) % 20) + '" r=".9" fill="#fff" opacity=".7"/>';
    // sunset marker
    if (sunset > t0 && sunset < t1) {
      g += '<circle cx="' + x(sunset) + '" cy="38" r="8" fill="#F6C451"/><rect x="' + (x(sunset) - 10) + '" y="38" width="20" height="10" fill="var(--surface)"/>';
      const sa = x(sunset) > X1 - 70 ? 'end' : 'middle';
      g += '<text class="lbl-w" x="' + (sa === 'end' ? x(sunset) - 12 : x(sunset)) + '" y="25" text-anchor="' + sa + '">закат ' + s.context.sunset + '</text>';
    }
    // time ticks
    const markTimes = plan.filter((p) => p.type === 'mark').map((p) => p.a);
    for (let t = Math.ceil(t0 / 30) * 30; t <= t1; t += 30) {
      if ((x(t) > x(now) - 22 && x(t) < x(now) + 92) || x(t) < X0 + 16 || x(t) > X1 - 16) continue;
      if (markTimes.some((m) => Math.abs(m - t) < 16 && plan.length)) continue;
      g += '<text class="tick" x="' + x(t).toFixed(1) + '" y="' + (plan.length ? 102 : 58) + '" text-anchor="middle">' + fmt(t) + '</text>';
    }
    // plan track
    if (plan.length) {
      g += '<line x1="' + X0 + '" x2="' + X1 + '" y1="76" y2="76" stroke="var(--line)" stroke-width="2"/>';
      plan.forEach((p) => {
        if (p.type === 'walk') {
          g += '<line x1="' + x(p.a) + '" x2="' + x(p.b) + '" y1="76" y2="76" stroke="' + (p.cold ? 'var(--cold)' : 'var(--ink-2)') + '" stroke-width="3" stroke-dasharray="2 3" stroke-linecap="round"/>';
        } else if (p.type === 'ride') {
          g += '<line x1="' + x(p.a) + '" x2="' + x(p.b) + '" y1="76" y2="76" stroke="var(--sun)" stroke-width="4" stroke-linecap="round"/>';
          g += '<text class="tick halo" x="' + ((x(p.a) + x(p.b)) / 2) + '" y="91" text-anchor="middle" style="fill:var(--sun);font-weight:600">' + esc(p.label) + '</text>';
        } else if (p.type === 'visit') {
          const w = Math.max(18, x(p.b) - x(p.a));
          g += '<rect x="' + x(p.a) + '" y="67" width="' + w + '" height="18" rx="6" fill="var(--sky-soft)" stroke="var(--sky)" stroke-width="1.4"/>';
          const label = w > 92 ? p.label : (p.short || '');
          if (label) g += '<text class="lbl" x="' + (x(p.a) + (w > 92 ? 9 : w / 2)) + '" y="80" text-anchor="' + (w > 92 ? 'start' : 'middle') + '" style="fill:var(--sky-ink)">' + esc(label) + '</text>';
        } else if (p.type === 'mark') {
          g += '<line x1="' + x(p.a) + '" x2="' + x(p.a) + '" y1="64" y2="88" stroke="' + p.color + '" stroke-width="2"/>';
          const anchor = p.anchor || (x(p.a) > X1 - 50 ? 'end' : x(p.a) < X0 + 50 ? 'start' : 'middle');
          g += '<text class="tick halo" x="' + x(p.a) + '" y="' + (p.up === false ? 102 : 61) + '" text-anchor="' + anchor + '" style="fill:' + p.color + ';font-weight:600">' + esc(p.label) + '</text>';
        }
      });
    }
    // now
    g += '<line x1="' + x(now) + '" x2="' + x(now) + '" y1="0" y2="' + (plan.length ? 90 : 44) + '" stroke="var(--ink)" stroke-width="2"/>';
    g += '<circle cx="' + x(now) + '" cy="' + (plan.length ? 76 : 40) + '" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>';
    g += '<text class="lbl halo" x="' + (x(now) + 6) + '" y="' + (plan.length ? 102 : 58) + '">сейчас ' + fmt(now) + '</text>';

    return '<svg class="strip" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Небо на ближайшие часы: сейчас ' + fmt(now) + ', закат ' + s.context.sunset + '">' + g + '</svg>';

  function skyCard(s, plan, opts = {}) {

      '</section>';
  }

  /* ------------------------------------------------------------ pieces */
  function whereCard(s, open) {
    const o = s.origin;

        '<li><b>KeruenCity</b><span>шоссе Коргалжын, 1</span></li><li><b>Керуен</b><span>улица Достык, 9</span></li><li><b>Керуен Сарай</b><span>улица Кенесары, 42</span></li></ul>' +
        '<div class="src">Подсказки 2GIS · точная точка остаётся на телефоне</div></div>' : '');
  }
  function composer(s, value) {
    const c = s ? s.constraints : {};
    const chips = [

  }
  const REASON_ICON = {kids: 'child', family: 'child', warm_stop: 'warm', indoor: 'warm', near: 'near', view: 'eye', culture: 'sparkle', unusual: 'sparkle', free: 'check'};
  const REASON_TXT = {kids: 'для детей', warm_stop: 'в тепле', indoor: 'в помещении', view: 'вид', culture: 'культура', unusual: 'необычно', free: 'бесплатно', near: 'совсем рядом'};
  function reasons(card) {
    const out = [];
    if (card.walk_min <= 7) out.push('near');

  /* ------------------------------------------------------------ map */
  let map = null, markers = [], mapStyle = null;
  function geohashBox(gh) {
    const B = '0123456789bcdefghjkmnpqrstuvwxyz'; let lat = [-90, 90], lon = [-180, 180], even = true;
    for (const c of gh) { const cd = B.indexOf(c); for (const mask of [16, 8, 4, 2, 1]) { const r = even ? lon : lat; const mid = (r[0] + r[1]) / 2; if (cd & mask) r[0] = mid; else r[1] = mid; even = !even; } }
    return [[lon[0], lat[0]], [lon[1], lat[0]], [lon[1], lat[1]], [lon[0], lat[1]], [lon[0], lat[0]]];
  }
  function placeMapHost() {
    const phone = window.matchMedia('(max-width: 999.98px)').matches;
    const host = phone ? document.getElementById('phone-map-host') : document.getElementById('map-home');
    const m = document.getElementById('map');
    if (host && m.parentElement !== host) { host.appendChild(m); if (phone) host.insertAdjacentHTML('beforeend', '<div class="attrib">© OpenFreeMap © OSM · API 2ГИС</div>'); if (map) map.resize(); }
  }
  function declutter() {   // places in one building (Fame City inside Хан Шатыр) would sit on top of each other: stack them upwards
    const placed = [];
    markers.filter((m) => m.__pin).forEach((m) => {
      const p = map.project(m.getLngLat());
      const H = map.getContainer().clientHeight;
      const free = (dy) => p.y + dy > 18 && p.y + dy < H - 30 && !placed.some((q) => Math.abs(q.x - p.x) < 34 && Math.abs(q.y - (p.y + dy)) < 34);
      const dy = [0, -36, 36, -72, 72].find(free) ?? 0;
      m.setOffset([-15, dy]);
      placed.push({x: p.x, y: p.y + dy});
    });
  }
  function setMap(s, cards, opts = {}) {
    placeMapHost();
    const dark = document.documentElement.dataset.theme === 'dark';
    const style = 'https://tiles.openfreemap.org/styles/' + (dark ? 'dark' : 'positron');
    $('#mapbadge').innerHTML = ic('lock', 's') + 'Сервер видит только клетку <b>~150 м</b>';
    const draw = () => {
      markers.forEach((m) => m.remove()); markers = [];
      const cell = geohashBox(s.cell);
      const byId = Object.fromEntries((s.cards || []).map((c) => [c.poi_id, c]));
      const route = opts.noRoute ? [] : (s.route && s.route.legs || []).flatMap((l) => {
        const to = byId[l.to_id];
        if (l.meters < 150 && to) return [[s.origin.lon, s.origin.lat], [to.lon, to.lat]];   // same building: 2GIS goes via the entrance, a straight line reads better
        return (l.geometry || []).filter((p, i, a) => !i || p[0] !== a[i - 1][0] || p[1] !== a[i - 1][1]);
      });
      const srcs = {cell: {type: 'Feature', geometry: {type: 'Polygon', coordinates: [cell]}}, route: {type: 'Feature', geometry: {type: 'LineString', coordinates: route.length > 1 ? route : [[s.origin.lon, s.origin.lat], [s.origin.lon, s.origin.lat]]}}};
      for (const [id, data] of Object.entries(srcs)) {
        if (map.getSource(id)) map.getSource(id).setData(data); else map.addSource(id, {type: 'geojson', data});
      }
      if (!map.getLayer('cell-fill')) {
        map.addLayer({id: 'cell-fill', type: 'fill', source: 'cell', paint: {'fill-color': dark ? '#5DC0E5' : '#1C7EA8', 'fill-opacity': .08}});
        map.addLayer({id: 'cell-line', type: 'line', source: 'cell', paint: {'line-color': dark ? '#5DC0E5' : '#1C7EA8', 'line-width': 1.5, 'line-dasharray': [2, 2]}});
        map.addLayer({id: 'route-casing', type: 'line', source: 'route', paint: {'line-color': dark ? '#09101A' : '#FFFFFF', 'line-width': 7}, layout: {'line-cap': 'round', 'line-join': 'round'}});
        map.addLayer({id: 'route', type: 'line', source: 'route', paint: {'line-color': dark ? '#E7EEF5' : '#13202A', 'line-width': 3.5}, layout: {'line-cap': 'round', 'line-join': 'round'}});
      }
      const me = document.createElement('div'); me.className = 'me';
      markers.push(new maplibregl.Marker({element: me}).setLngLat([s.origin.lon, s.origin.lat]).addTo(map));
      const pts = [[s.origin.lon, s.origin.lat]];
      cards.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'pin-m' + (i === 0 && c.role !== 'alternative' ? '' : ' pin-alt');
        el.textContent = String(i + 1);
        const lab = document.createElement('span'); lab.className = 'pin-label'; lab.textContent = c.name.length > 22 ? c.name.slice(0, 21) + '…' : c.name;
        const wrap = document.createElement('div'); wrap.className = 'pin-wrap'; wrap.appendChild(el); if (i < 3) wrap.appendChild(lab);
        const mk = new maplibregl.Marker({element: wrap, anchor: 'left', offset: [-15, 0]}).setLngLat([c.lon, c.lat]).addTo(map);
        mk.__pin = true; markers.push(mk);
        pts.push([c.lon, c.lat]);
      });
      cell.forEach((p) => pts.push(p));
      const b = pts.reduce((bb, p) => bb.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
      const phone = window.matchMedia('(max-width: 999.98px)').matches;
      const panelOpen = document.getElementById('panel').classList.contains('open');
      map.fitBounds(b, {padding: phone ? {top: 36, bottom: 36, left: 36, right: 110} : {top: 90, bottom: 80, left: 80, right: panelOpen ? 560 : 190}, maxZoom: 16.4, duration: 0});
      declutter();
      map.once('idle', () => { window.__mapIdle = true; window.__map = map; });
    };
    if (!map || mapStyle !== style) {
      if (map) map.remove();
      mapStyle = style;
      map = new maplibregl.Map({container: 'map', style, center: [s.origin.lon, s.origin.lat], zoom: 15, attributionControl: false});
      map.on('load', draw);
      map.on('zoomend', declutter);
    } else if (map.isStyleLoaded()) draw(); else map.once('load', draw);
  }

  /* ------------------------------------------------------------ router */
  function parkMap() {   // the phone moves the map into the feed; keep it alive before the feed is re-rendered
    const m = document.getElementById('map'), home = document.getElementById('map-home');
    if (m && home && m.parentElement !== home) home.appendChild(m);
  }
  function route() {
    parkMap();
    const h = decodeURIComponent(location.hash.slice(1) || 'main');
    const dark = /-dark$/.test(h);
    const name = h.replace(/-dark$/, '');
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('#theme').innerHTML = ic(dark ? 'sun' : 'moon');
    $('#theme').onclick = () => { location.hash = name + (dark ? '' : '-dark'); };
    const p = $('#panel'); p.classList.remove('open'); p.innerHTML = '';
    window.__mapIdle = false;
    if (name === 'flight') screenFlight();
    else if (name === 'start') screenStart();
    else if (name === 'loading') screenLoading();
    else if (name === 'empty') screenEmpty();
    else if (name === 'error') screenMain({error: true, tpl: true});
    else {
      if (name === 'detail' || name === 'jury') {
        // open the panel first so the map leaves room for it
        const card = K.cards.find((c) => c.role !== 'alternative') || K.cards[0];
        if (name === 'detail') openPanel(detailHTML(card, K), 'Место');
        else openPanel(juryHTML(K), 'Как Seruen выбирал');
      }
      screenMain();
    }
    document.querySelectorAll('a[href^="#"]').forEach((a) => {
      const base = a.getAttribute('href').slice(1).replace(/-dark$/, '');
      a.setAttribute('href', '#' + base + (dark ? '-dark' : ''));
    });
  }
  window.addEventListener('hashchange', route);
  window.matchMedia('(max-width: 999.98px)').addEventListener('change', () => { placeMapHost(); });
  document.fonts && document.fonts.ready.then(() => {});
  route();
})();
</script>
