# Collector "collect-osm" (generated by deploy/scripts/gen-apps.sh): "0 3 * * *" Asia/Almaty
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-osm
  labels:
    app.kubernetes.io/name: collect-osm
    app.kubernetes.io/component: collector
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Almaty
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled   # a meshed sidecar would keep the Job from finishing
          labels:
            app.kubernetes.io/name: collect-osm
            app.kubernetes.io/component: collector
            app.kubernetes.io/part-of: seruen
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: seruen
          containers:
            - name: app
              image: registry.digitalocean.com/seruen/seruen:latest
              imagePullPolicy: Always
              env:
                - name: SERVICE
                  value: collect-osm
                - name: OTEL_SERVICE_NAME
                  value: collect-osm
                - name: POD_NAME
                  valueFrom: {fieldRef: {fieldPath: metadata.name}}
              envFrom:
                - configMapRef: {name: seruen-config}
                - secretRef: {name: seruen-secrets}
                - secretRef: {name: seruen-db}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 768Mi}
