# Seruen application base (namespace seruen). Validate / apply:
#   kubectl apply -k deploy/apps --dry-run=server
#   kubectl apply -k deploy/apps            (or Argo CD Application seruen-apps)
# Per-service files are generated by deploy/scripts/gen-apps.sh; hosts by deploy/scripts/render-hosts.sh.
# Secrets seruen-secrets / seruen-db are created by deploy/scripts/sync-secrets.sh (never stored in git).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seruen
labels:
  - pairs:
      app.kubernetes.io/part-of: seruen
    includeSelectors: false
resources:
  - configmap.yaml
  - services/orchestrator.yaml
  - services/session.yaml
  - services/context.yaml
  - services/nlu.yaml
  - services/retrieval.yaml
  - services/ranking.yaml
  - services/routing.yaml
  - services/explain.yaml
  - services/guard.yaml
  - services/llm-gateway.yaml
  - services/catalog-api.yaml
  - services/events-api.yaml
  - services/feedback-api.yaml
  - services/partner-portal.yaml
  - workers/normalizer.yaml
  - workers/dedup.yaml
  - workers/quality.yaml
  - workers/enrich.yaml
  - workers/embedder.yaml
  - workers/indexer.yaml
  - workers/analytics.yaml
  - workers/verifier.yaml
  - cronjobs/collect-osm.yaml
  - cronjobs/collect-overture.yaml
  - cronjobs/collect-wikidata.yaml
  - cronjobs/collect-wikivoyage.yaml
  - cronjobs/collect-visitastana.yaml
  - cronjobs/collect-sxodim.yaml
  - autoscaling.yaml
  - ingress.yaml
  - monitoring.yaml
images:
  - name: registry.digitalocean.com/seruen/seruen
    newTag: latest
patches:
  - path: patches/ingress-host.yaml
    target:
      kind: Ingress
      name: seruen
  - path: patches/public-url.yaml
