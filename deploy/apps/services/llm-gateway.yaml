# Online service "llm-gateway" (generated by deploy/scripts/gen-apps.sh)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: seruen
    spec:
      imagePullSecrets:
        - name: seruen
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: registry.digitalocean.com/seruen/seruen:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE
              value: llm-gateway
            - name: OTEL_SERVICE_NAME
              value: llm-gateway
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - configMapRef: {name: seruen-config}
            - secretRef: {name: seruen-secrets}
            - secretRef: {name: seruen-db}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      appProtocol: http
