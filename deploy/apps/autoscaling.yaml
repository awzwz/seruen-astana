# CPU autoscaling for the hot online path (needs metrics-server, installed by bootstrap.sh).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: orchestrator}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retrieval
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: retrieval}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
# KEDA: scale workers on Kafka consumer lag (group id = worker name = KAFKA_GROUP_ID). 3 partitions -> max 3.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: normalizer
spec:
  scaleTargetRef: {name: normalizer}
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: seruen-kafka-bootstrap.data.svc.cluster.local:9092
        consumerGroup: normalizer
        topic: poi.raw
        lagThreshold: "100"
        offsetResetPolicy: earliest
    - type: kafka
      metadata:
        bootstrapServers: seruen-kafka-bootstrap.data.svc.cluster.local:9092
        consumerGroup: normalizer
        topic: events.raw
        lagThreshold: "100"
        offsetResetPolicy: earliest
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: embedder
spec:
  scaleTargetRef: {name: embedder}
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: seruen-kafka-bootstrap.data.svc.cluster.local:9092
        consumerGroup: embedder
        topic: poi.changed
        lagThreshold: "50"
        offsetResetPolicy: earliest
