# Worker "analytics" (generated by deploy/scripts/gen-apps.sh). Kafka consumer; consumer group = KAFKA_GROUP_ID
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: seruen
    spec:
      imagePullSecrets:
        - name: seruen
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: registry.digitalocean.com/seruen/seruen:latest
          imagePullPolicy: Always
          env:
            - name: SERVICE
              value: analytics
            - name: OTEL_SERVICE_NAME
              value: analytics
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: KAFKA_GROUP_ID
              value: "analytics"
          envFrom:
            - configMapRef: {name: seruen-config}
            - secretRef: {name: seruen-secrets}
            - secretRef: {name: seruen-db}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
