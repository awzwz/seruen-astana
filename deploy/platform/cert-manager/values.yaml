# cert-manager (chart jetstack/cert-manager), namespace cert-manager.
crds:
  enabled: true
  keep: true
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
startupapicheck:
  enabled: true
prometheus:
  enabled: true
  servicemonitor:
    enabled: false
