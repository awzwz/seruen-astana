# PostgreSQL 17 + PostGIS 3.5 cluster "catalog" (CloudNativePG), namespace data.
# Services: catalog-rw.data:5432 (read/write), catalog-r / catalog-ro.
# CNPG generates the secret "catalog-app" (keys: username, password, host, port, dbname, uri, ...)
# for the owner role "seruen" of database "seruen". deploy/scripts/sync-secrets.sh copies it to namespace seruen.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: catalog
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: do-block-storage
  postgresql:
    parameters:
      # logical decoding for Debezium (outbox -> Kafka) later
      wal_level: logical
      max_wal_senders: "10"
      max_replication_slots: "10"
      shared_buffers: 128MB
      effective_cache_size: 384MB
      work_mem: 8MB
      maintenance_work_mem: 64MB
      max_connections: "150"
  bootstrap:
    initdb:
      database: seruen
      owner: seruen
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS unaccent;
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
  # Login roles for the optional Langfuse / Unleash (databases in optional-dbs.yaml).
  # Password secrets (type basic-auth) are created by bootstrap.sh step "optional"; until they exist CNPG
  # only reports the role as pending, the cluster itself is unaffected.
  managed:
    roles:
      - name: langfuse
        ensure: present
        login: true
        passwordSecret:
          name: pg-langfuse
      - name: unleash
        ensure: present
        login: true
        passwordSecret:
          name: pg-unleash
