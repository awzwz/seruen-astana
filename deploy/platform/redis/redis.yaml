# Redis 7 (official image), namespace data. redis.data:6379, no password (ClusterIP only, never exposed).
# db 0 sessions (TTL 30 min), db 1 caches, db 2 Celery broker for the verifier.
# maxmemory-policy volatile-lru: only keys with a TTL (sessions, caches) are evicted, Celery queues are kept.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels: {app.kubernetes.io/name: redis}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: redis}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: data
  labels: {app.kubernetes.io/name: redis}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: redis}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
  labels: {app.kubernetes.io/name: redis}
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 100mb
            - --maxmemory-policy
            - volatile-lru
            - --save
            - ""
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 1Gi
