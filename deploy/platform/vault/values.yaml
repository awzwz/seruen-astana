# HashiCorp Vault in **DEV MODE** (chart hashicorp/vault), namespace platform.
# !!! DEV MODE: in-memory storage, auto-unsealed, everything is lost on pod restart. Demo only. !!!
# vault.platform:8200, root token in deploy/secrets/vault.env (passed to helm via a gitignored values file).
global:
  enabled: true
injector:
  enabled: false
server:
  dev:
    enabled: true
    # devRootToken comes from deploy/secrets/vault-values.yaml (generated by bootstrap.sh)
  standalone:
    enabled: false
  ha:
    enabled: false
  dataStorage:
    enabled: false
  auditStorage:
    enabled: false
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 256Mi}
  extraLabels:
    seruen.io/mode: dev
  annotations:
    seruen.io/warning: "Vault DEV MODE - in-memory, not for real secrets"
ui:
  enabled: false
csi:
  enabled: false
