# ClickHouse 26.9 (official image; 26.x needed for the full-text index syntax of Langfuse 4.x migrations), namespace data. clickhouse.data:8123 (HTTP), :9000 (native).
# User "seruen" + password from secret data/clickhouse-auth (CLICKHOUSE_USER/CLICKHOUSE_PASSWORD/CLICKHOUSE_DB),
# database "seruen" is created by the image entrypoint on first start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: data
data:
  low-memory.xml: |
    <clickhouse>
      <max_server_memory_usage_to_ram_ratio>0.75</max_server_memory_usage_to_ram_ratio>
      <mark_cache_size>268435456</mark_cache_size>
      <index_mark_cache_size>67108864</index_mark_cache_size>
      <uncompressed_cache_size>0</uncompressed_cache_size>
      <max_concurrent_queries>50</max_concurrent_queries>
      <!-- the system log tables are the main source of idle disk/memory churn on small nodes -->
      <trace_log remove="1"/>
      <text_log remove="1"/>
      <metric_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <query_thread_log remove="1"/>
      <processors_profile_log remove="1"/>
      <opentelemetry_span_log remove="1"/>
      <latency_log remove="1"/>
      <part_log remove="1"/>
      <session_log remove="1"/>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: data
  labels: {app.kubernetes.io/name: clickhouse}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: clickhouse}
  ports:
    - {name: http, port: 8123, targetPort: 8123}
    - {name: native, port: 9000, targetPort: 9000}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: data
  labels: {app.kubernetes.io/name: clickhouse}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: clickhouse}
  ports:
    - {name: http, port: 8123}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: data
  labels: {app.kubernetes.io/name: clickhouse}
spec:
  serviceName: clickhouse-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: clickhouse}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clickhouse}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.9.22
          envFrom:
            - secretRef: {name: clickhouse-auth}
          env:
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /ping, port: 8123}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: 8123}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/low-memory.xml
              subPath: low-memory.xml
      volumes:
        - name: config
          configMap: {name: clickhouse-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 10Gi
