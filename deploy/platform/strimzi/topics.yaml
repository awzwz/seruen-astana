# Kafka topics from docs/CONTRACTS.md. Partitions 3, RF 1. CONTRACTS gives no retention, so 7 days (604800000 ms) everywhere.
# Topic names contain dots, which are valid Kubernetes object names, so metadata.name == topic name.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: poi.raw
  namespace: data
  labels:
    strimzi.io/cluster: seruen
spec:
  topicName: poi.raw
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
