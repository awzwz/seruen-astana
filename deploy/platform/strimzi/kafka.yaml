# Kafka cluster "seruen" (Strimzi 1.3, API kafka.strimzi.io/v1, KRaft only).
# One node with roles controller+broker, RF=1 everywhere. Bootstrap: seruen-kafka-bootstrap.data:9092 (plain, in-cluster only).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: data
  labels:
    strimzi.io/cluster: seruen
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: do-block-storage
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    "-Xms": 768m
    "-Xmx": 768m
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 1536Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: seruen
  namespace: data
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 3
      # Forgiving for the hackathon; declare real topics in topics.yaml anyway.
      auto.create.topics.enable: true
      log.retention.hours: 168
      log.segment.bytes: 104857600
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 384Mi
  # Consumer-lag metrics for Grafana (KEDA reads lag directly from Kafka).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
