name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and web syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (engine, 2GIS key pool, voice, ingest)
        run: PYTHONPATH=. python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web client parses
        run: for f in web/*.js; do node --check "$f"; done
